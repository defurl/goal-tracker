# Three jobs:
#   verify              the Phase 0 gate — lint, colour discipline, types, build,
#                       bundle budgets
#   scene-capture       the scene's own gate — screenshots every state and runs
#                       the lighting acceptance test against them
#   colour-lint-self-test
#                       asserts the colour lint still FAILS on each of the three
#                       things it is supposed to catch
#
# The last job exists because a check that has quietly stopped failing is worse
# than no check: it is a claim nobody re-examines. Each failure mode is asserted
# rather than assumed.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Colour discipline
        run: pnpm lint:colors

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Bundle budgets (D-10)
        run: pnpm bundle:check

  # The scene has two mechanical checks and neither was running here, which made
  # them checks only as long as somebody remembered to run them. The capture is
  # the review record (10-tech-stack.md calls it one of the two scripts that
  # "kept the design honest across five phases") and the lighting test is the
  # acceptance gate in 05-lighting-rig.md §4.
  #
  # Runs on SwiftShader: the runner has no GPU, and the capture script already
  # forces ANGLE for exactly that reason. Measured luminances matched an Intel
  # GPU when this was checked, so software rendering is not a second-class
  # result here.
  scene-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # nohup + disown so the server survives the end of this step's shell, and
      # a log file so a failure to start is diagnosable rather than silent.
      - name: Start the server
        run: |
          nohup pnpm start > /tmp/next.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:3000; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server never answered on :3000"
          cat /tmp/next.log
          exit 1

      - name: Capture every scene state
        run: pnpm capture:states ci

      # Both halves, because 05-lighting-rig.md §5 requires the test to pass with
      # post-processing on AND off. Bloom is disabled under reduced motion, so
      # the reduced-motion capture is the effects-off case.
      - name: Lighting acceptance test, effects on
        run: pnpm lighting:test ci

      - name: Lighting acceptance test, effects off
        run: pnpm lighting:test ci room-rest-desktop-reduced-motion

      # Uploaded on failure too — a failed lighting gate is exactly when someone
      # needs to see the frame that failed it.
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-captures
          path: captures/ci/
          if-no-files-found: error

      - name: Server log
        if: failure()
        run: cat /tmp/next.log || true

      - name: Stop the server
        if: always()
        run: pkill -f 'next start' || true

  # The colour lint is the one piece of the visual contract that is mechanical
  # rather than remembered. If it ever stops failing, it stops being worth having,
  # so each of its three failure modes is asserted rather than assumed.
  colour-lint-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: A hex outside the palette must fail the build
        run: |
          printf '/* deliberate violation — CI asserts this fails */\n.x { color: #BADA55; }\n' \
            > styles/__lint_fixture.css
          if pnpm lint:colors; then
            echo "::error::lint:colors passed on an off-palette hex literal. The colour lint is broken."
            exit 1
          fi
          rm styles/__lint_fixture.css
          echo "ok — off-palette hex rejected"

      - name: A malformed design-spec.jsonc must fail the build
        run: |
          cp design-spec.jsonc /tmp/design-spec.bak
          sed -i 's|"--bg-void":\( *\)"#05070D",|"--bg-void":\1"#05070D",,|' design-spec.jsonc
          if pnpm lint:colors; then
            echo "::error::lint:colors passed on an unparseable design-spec.jsonc."
            exit 1
          fi
          cp /tmp/design-spec.bak design-spec.jsonc
          echo "ok — malformed JSONC rejected"

      - name: A mirror that drifts must fail the build
        run: |
          cp styles/tokens.css /tmp/tokens.bak
          sed -i 's|--signal: #F2A0B5;|--signal: #F2A0B6;|' styles/tokens.css
          if pnpm lint:colors; then
            echo "::error::lint:colors passed while the three palette mirrors disagreed."
            exit 1
          fi
          cp /tmp/tokens.bak styles/tokens.css
          echo "ok — mirror drift rejected"
        env:
          FORCE_COLOR: '0'
