# Five jobs:
#   verify              the Phase 0 gate — lint, colour discipline, types, build,
#                       bundle budgets
#   scene-capture       the scene's own gate — screenshots every state and runs
#                       the lighting acceptance test against them
#   lighthouse          the Phase 4.1 budgets — Lighthouse CI over every route
#   database            the track B gate — cross-user isolation over all twelve
#                       tables, and the 013 functions, on a fresh local stack
#   colour-lint-self-test
#                       asserts the colour lint still FAILS on each of the three
#                       things it is supposed to catch
#
# The last job exists because a check that has quietly stopped failing is worse
# than no check: it is a claim nobody re-examines. Each failure mode is asserted
# rather than assumed.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here. package.json's `packageManager` field pins pnpm, and
      # action-setup refuses to run when both are set — which is why every run
      # of this workflow failed until this was removed.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Colour discipline
        run: pnpm lint:colors

      - name: Typecheck
        run: pnpm typecheck

      # No database and no network to the model provider: the agents' guards,
      # error mapping and fallbacks, exercised with injected dependencies.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budgets (D-10)
        run: pnpm bundle:check

  # The scene has two mechanical checks and neither was running here, which made
  # them checks only as long as somebody remembered to run them. The capture is
  # the review record (10-tech-stack.md calls it one of the two scripts that
  # "kept the design honest across five phases") and the lighting test is the
  # acceptance gate in 05-lighting-rig.md §4.
  #
  # Runs on SwiftShader: the runner has no GPU, and the capture script already
  # forces ANGLE for exactly that reason. Measured luminances matched an Intel
  # GPU when this was checked, so software rendering is not a second-class
  # result here.
  scene-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here. package.json's `packageManager` field pins pnpm, and
      # action-setup refuses to run when both are set — which is why every run
      # of this workflow failed until this was removed.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # nohup + disown so the server survives the end of this step's shell, and
      # a log file so a failure to start is diagnosable rather than silent.
      - name: Start the server
        run: |
          nohup pnpm start > /tmp/next.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:3000; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server never answered on :3000"
          cat /tmp/next.log
          exit 1

      - name: Capture every scene state
        run: pnpm capture:states ci

      # Both halves, because 05-lighting-rig.md §5 requires the test to pass with
      # post-processing on AND off. Bloom is disabled under reduced motion, so
      # the reduced-motion capture is the effects-off case.
      - name: Lighting acceptance test, effects on
        run: pnpm lighting:test ci

      - name: Lighting acceptance test, effects off
        run: pnpm lighting:test ci room-rest-desktop-reduced-motion

      - name: Lighting acceptance test, at dawn (mug steam, A5.3)
        run: pnpm lighting:test ci room-dawn-desktop

      # The daylit window's extremes (A5.4): brightest sky and rim, and darkest.
      - name: Lighting acceptance test, noon, effects on and off
        run: |
          pnpm lighting:test ci room-noon-desktop
          pnpm lighting:test ci room-noon-desktop-reduced-motion

      - name: Lighting acceptance test, midnight, effects on and off
        run: |
          pnpm lighting:test ci room-midnight-desktop
          pnpm lighting:test ci room-midnight-desktop-reduced-motion

      # Build plan 4.2. Here rather than in its own job because it needs the
      # same thing the capture does: a built server and a WebGL-capable browser.
      - name: Accessibility smoke (axe-core)
        run: pnpm a11y:check

      # Build plan 4.3: under reduced motion the room must not move at all.
      - name: Reduced motion is removed, not reduced
        run: pnpm motion:check

      # Build plan 4.5: /text from the service worker with the network off.
      - name: Offline
        run: pnpm offline:check

      # Uploaded on failure too — a failed lighting gate is exactly when someone
      # needs to see the frame that failed it. `warn`, not `error`, on an empty
      # directory: if an earlier step failed there is nothing to upload, and a
      # second red mark here only buries the first. The capture step already
      # fails on its own if it produces nothing.
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scene-captures
          path: captures/ci/
          if-no-files-found: warn

      - name: Server log
        if: failure()
        run: cat /tmp/next.log || true

      - name: Stop the server
        if: always()
        run: pkill -f 'next start' || true

  # Build plan 4.1: Lighthouse CI with asserted budgets. Its own job so a slow
  # Lighthouse run never holds up the lighting gate, and so its reports upload
  # separately. /text and auth only: with no GPU the runner cannot draw the
  # room fast enough for Lighthouse to finish (scripts/lh-check.ts says more).
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here. package.json's `packageManager` field pins pnpm, and
      # action-setup refuses to run when both are set — which is why every run
      # of this workflow failed until this was removed.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Start the server
        run: |
          nohup pnpm start > /tmp/next.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:3000; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server never answered on :3000"
          cat /tmp/next.log
          exit 1

      - name: Lighthouse budgets
        run: pnpm lh:check mobile

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # The directory is hidden, and hidden files are skipped by default.
          include-hidden-files: true
          if-no-files-found: warn

      - name: Server log
        if: failure()
        run: cat /tmp/next.log || true

      - name: Stop the server
        if: always()
        run: pkill -f 'next start' || true

  # The Phase 1 track B gate (06-build-plan.md): as user A, read and write all
  # twelve tables as user B, and all 24 attempts must fail. Plus the behaviour of
  # 013_functions.sql. Runs against a fresh local stack built from
  # supabase/migrations/, never against the hosted project — the harness
  # refuses any non-local URL.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here. package.json's `packageManager` field pins pnpm, and
      # action-setup refuses to run when both are set — which is why every run
      # of this workflow failed until this was removed.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The CLI is a devDependency, so CI runs the version the lockfile pins —
      # the same one that generated the committed types.
      - run: pnpm install --frozen-lockfile

      # Only what the tests touch: Postgres, auth, PostgREST and the gateway.
      # The rest of the stack costs minutes of image pulls for nothing.
      - name: Start the local stack and apply every migration
        run: pnpm exec supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor

      - name: Cross-user isolation gate and function tests
        run: pnpm test:db

      # 03-data-model.md §8: regenerate on every migration. A migration
      # committed without its types fails here instead of at runtime.
      - name: Generated types match the migrations
        run: |
          pnpm db:types
          if ! git diff --exit-code lib/supabase/database.types.ts; then
            echo "::error::lib/supabase/database.types.ts is stale. Run pnpm db:types and commit it."
            exit 1
          fi

      - name: Stop the stack
        if: always()
        run: pnpm exec supabase stop --no-backup

  # The colour lint is the one piece of the visual contract that is mechanical
  # rather than remembered. If it ever stops failing, it stops being worth having,
  # so each of its three failure modes is asserted rather than assumed.
  colour-lint-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here. package.json's `packageManager` field pins pnpm, and
      # action-setup refuses to run when both are set — which is why every run
      # of this workflow failed until this was removed.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: A hex outside the palette must fail the build
        run: |
          printf '/* deliberate violation — CI asserts this fails */\n.x { color: #BADA55; }\n' \
            > styles/__lint_fixture.css
          if pnpm lint:colors; then
            echo "::error::lint:colors passed on an off-palette hex literal. The colour lint is broken."
            exit 1
          fi
          rm styles/__lint_fixture.css
          echo "ok — off-palette hex rejected"

      - name: A malformed design-spec.jsonc must fail the build
        run: |
          cp design-spec.jsonc /tmp/design-spec.bak
          sed -i 's|"--bg-void":\( *\)"#05070D",|"--bg-void":\1"#05070D",,|' design-spec.jsonc
          if pnpm lint:colors; then
            echo "::error::lint:colors passed on an unparseable design-spec.jsonc."
            exit 1
          fi
          cp /tmp/design-spec.bak design-spec.jsonc
          echo "ok — malformed JSONC rejected"

      - name: A mirror that drifts must fail the build
        run: |
          cp styles/tokens.css /tmp/tokens.bak
          sed -i 's|--signal: #F2A0B5;|--signal: #F2A0B6;|' styles/tokens.css
          if pnpm lint:colors; then
            echo "::error::lint:colors passed while the three palette mirrors disagreed."
            exit 1
          fi
          cp /tmp/tokens.bak styles/tokens.css
          echo "ok — mirror drift rejected"
        env:
          FORCE_COLOR: '0'
