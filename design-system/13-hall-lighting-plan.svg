<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" font-family="ui-monospace, 'Departure Mono', Menlo, monospace">
  <!-- The hall — lighting plan (design-system/13-door-scene.md). PROPOSED.   -->
  <!-- Top-down. Plan scale: 1 m = 100 px; px = 510 + 100x, py = 300 + 100(z + 1.5). -->
  <!-- Palette tokens only (lint:colors).                                      -->

  <rect x="0" y="0" width="1500" height="900" fill="#0A0F1A"/>
  <text x="40" y="52" fill="#F0F2F5" font-size="24">The hall — lighting plan · PROPOSED</text>
  <text x="40" y="78" fill="#9BA3B4" font-size="13">Top-down · metres · y = 0 is the hall floor · five roles, six instances, the room's ratios to the key</text>

  <!-- Plan panel -->
  <rect x="40" y="100" width="940" height="760" fill="#121826" stroke="#2E3340"/>
  <text x="60" y="126" fill="#F2A0B5" font-size="12" letter-spacing="2">PLAN VIEW · +X RIGHT · +Z TOWARD CAMERA</text>

  <!-- 1 m grid -->
  <g stroke="#2E3340" stroke-width="0.5" stroke-opacity="0.6">
    <line x1="160" y1="150" x2="160" y2="840"/><line x1="260" y1="150" x2="260" y2="840"/>
    <line x1="360" y1="150" x2="360" y2="840"/><line x1="460" y1="150" x2="460" y2="840"/>
    <line x1="560" y1="150" x2="560" y2="840"/><line x1="660" y1="150" x2="660" y2="840"/>
    <line x1="760" y1="150" x2="760" y2="840"/><line x1="860" y1="150" x2="860" y2="840"/>
    <line x1="60" y1="200" x2="960" y2="200"/><line x1="60" y1="300" x2="960" y2="300"/>
    <line x1="60" y1="400" x2="960" y2="400"/><line x1="60" y1="500" x2="960" y2="500"/>
    <line x1="60" y1="600" x2="960" y2="600"/><line x1="60" y1="700" x2="960" y2="700"/>
    <line x1="60" y1="800" x2="960" y2="800"/>
  </g>
  <text x="510" y="146" fill="#5A6275" font-size="10" text-anchor="middle">x = 0</text>
  <text x="160" y="146" fill="#5A6275" font-size="10" text-anchor="middle">x = -3.5</text>
  <text x="860" y="146" fill="#5A6275" font-size="10" text-anchor="middle">x = +3.5</text>

  <!-- Warm rectangle on the floor inside the doorway (criterion 3) -->
  <rect x="160" y="370" width="150" height="120" fill="#FFB661" fill-opacity="0.12"/>
  <!-- Key pool on the floor under the pendant (criterion 1) -->
  <circle cx="450" cy="410" r="120" fill="#FFB661" fill-opacity="0.10"/>
  <circle cx="450" cy="410" r="60" fill="#FFB661" fill-opacity="0.12"/>

  <!-- Walls -->
  <g stroke="#9BA3B4" stroke-width="3">
    <line x1="160" y1="300" x2="860" y2="300"/>
    <line x1="160" y1="300" x2="160" y2="460"/>
    <line x1="160" y1="560" x2="160" y2="760"/>
    <line x1="860" y1="300" x2="860" y2="760"/>
  </g>
  <text x="510" y="290" fill="#9BA3B4" font-size="11" text-anchor="middle">history wall · z = -1.5 · 7 × 2.6 m</text>
  <text x="150" y="515" fill="#9BA3B4" font-size="11" text-anchor="end">doorway</text>
  <text x="150" y="530" fill="#5A6275" font-size="10" text-anchor="end">to the room</text>
  <!-- History band: one line per habit, oldest left, today right -->
  <line x1="235" y1="306" x2="785" y2="306" stroke="#8E4A5C" stroke-width="4" stroke-dasharray="2 2"/>
  <text x="235" y="322" fill="#8E4A5C" font-size="10">oldest</text>
  <text x="785" y="322" fill="#8E4A5C" font-size="10" text-anchor="end">today</text>
  <!-- Clerestory -->
  <rect x="856" y="345" width="8" height="40" fill="#3F6B77"/>
  <text x="872" y="370" fill="#3F6B77" font-size="11">clerestory</text>

  <!-- Tree in its planter -->
  <rect x="417" y="378" width="66" height="44" fill="#2E3340" stroke="#9BA3B4" transform="rotate(20 450 400)"/>
  <circle cx="450" cy="400" r="30" fill="none" stroke="#4ADE80" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="450" y="455" fill="#9BA3B4" font-size="11" text-anchor="middle">tree · [-0.6, 0, -0.5] · ×5</text>

  <!-- KEY: pendant -->
  <circle cx="450" cy="410" r="9" fill="#FFB661"/>
  <text x="468" y="402" fill="#FFB661" font-size="11">KEY · pendant · y 2.2</text>

  <!-- FILL x2: floor uplights at the wall -->
  <g fill="#7FC4D8">
    <circle cx="310" cy="360" r="7"/><circle cx="710" cy="360" r="7"/>
  </g>
  <g stroke="#7FC4D8" stroke-opacity="0.5" fill="#7FC4D8" fill-opacity="0.06">
    <path d="M310 360 L250 302 L370 302 Z"/><path d="M710 360 L650 302 L770 302 Z"/>
  </g>
  <text x="310" y="380" fill="#7FC4D8" font-size="11" text-anchor="middle">FILL</text>
  <text x="710" y="380" fill="#7FC4D8" font-size="11" text-anchor="middle">FILL</text>

  <!-- RIM: from the clerestory -->
  <circle cx="840" cy="370" r="7" fill="#3F6B77"/>
  <line x1="840" y1="370" x2="520" y2="350" stroke="#3F6B77" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="836" y="400" fill="#3F6B77" font-size="11" text-anchor="end">RIM · directional</text>

  <!-- DOOR SPILL: outside the doorway -->
  <circle cx="90" cy="510" r="9" fill="#FFB661"/>
  <line x1="90" y1="510" x2="250" y2="430" stroke="#FFB661" stroke-opacity="0.6" stroke-dasharray="6 4"/>
  <text x="70" y="545" fill="#FFB661" font-size="11">SPILL</text>

  <!-- Cameras -->
  <g fill="#F0F2F5">
    <path d="M270 690 l-10 16 l22 -2 z"/>
    <path d="M600 540 l-9 14 l19 0 z"/>
    <path d="M340 530 l-9 14 l19 -1 z"/>
  </g>
  <line x1="270" y1="700" x2="530" y2="330" stroke="#F0F2F5" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <text x="290" y="720" fill="#F0F2F5" font-size="11">arrival (rest) · [-2.4, 1.55, 2.4]</text>
  <text x="615" y="560" fill="#F0F2F5" font-size="11">the wall · glide + panel</text>
  <text x="300" y="565" fill="#F0F2F5" font-size="11" text-anchor="end">the tree · glide only</text>

  <!-- Legend -->
  <rect x="1000" y="100" width="460" height="760" fill="#121826" stroke="#2E3340"/>
  <text x="1020" y="126" fill="#F2A0B5" font-size="12" letter-spacing="2">THE RIG · STARTING VALUES</text>
  <g font-size="12">
    <text x="1020" y="166" fill="#FFB661">KEY · pointLight · LAMP_WARM</text>
    <text x="1020" y="184" fill="#9BA3B4">[-0.6, 2.2, -0.4] · 14.0 · d 4.5 · decay 2</text>
    <text x="1020" y="200" fill="#5A6275">sole shadow-caster · ratio 1.00</text>

    <text x="1020" y="240" fill="#7FC4D8">FILL ×2 · spotLight · GLOW_COOL</text>
    <text x="1020" y="258" fill="#9BA3B4">[±2.0, 0.1, -0.9] · 5.6 each · up the band</text>
    <text x="1020" y="274" fill="#5A6275">the wall is the screen · ratio 0.40</text>

    <text x="1020" y="314" fill="#3F6B77">RIM · directional · GLOW_COOL_SOFT</text>
    <text x="1020" y="332" fill="#9BA3B4">[3.3, 2.0, -0.8] → [0, 1, -1] · 2.1</text>
    <text x="1020" y="348" fill="#5A6275">rises with the hour (RIM_STATES) · ratio 0.15</text>

    <text x="1020" y="388" fill="#FFB661">DOOR SPILL · pointLight · LAMP_WARM</text>
    <text x="1020" y="406" fill="#9BA3B4">[-4.2, 1.2, 0.6] · 6.2 · d 3.5</text>
    <text x="1020" y="422" fill="#5A6275">the room, seen from outside · ratio 0.44</text>

    <text x="1020" y="462" fill="#9BA3B4">AMBIENT · BG_NIGHT · 0.28</text>
    <text x="1020" y="478" fill="#5A6275">ratio 0.02</text>
  </g>
  <text x="1020" y="530" fill="#F2A0B5" font-size="12" letter-spacing="2">ACCEPTANCE · ALL FIVE TRUE</text>
  <g font-size="12" fill="#F0F2F5">
    <text x="1020" y="560">1  the tree's pool is the brightest area</text>
    <text x="1020" y="584">2  right edge cooler than the left</text>
    <text x="1020" y="608">3  warm rectangle on the floor, camera-left</text>
    <text x="1020" y="632">4  the wall is texture at rest, a record up close</text>
    <text x="1020" y="656">5  nothing pure black, nothing flooded; peak &lt; 1</text>
  </g>
  <text x="1020" y="700" fill="#5A6275" font-size="11">at rest · effects on and off · noon and midnight</text>
  <text x="1020" y="740" fill="#5A6275" font-size="11">Intensities are placeholders, tuned against the</text>
  <text x="1020" y="756" fill="#5A6275" font-size="11">test at build. The ratios are what must hold.</text>
</svg>
