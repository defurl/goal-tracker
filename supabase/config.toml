# Supabase CLI configuration — the LOCAL stack only (`supabase start`).
#
# The hosted project (see .env.example) is configured in its dashboard, not
# here. Anything omitted takes the CLI's default.
#
# Never `supabase config push` this file: it would switch email confirmation
# off on the hosted project and point its site URL at localhost. Where a value
# below mirrors the hosted auth hardening (security items 3, 4, 12, 17), its
# comment says so; the rest of that checklist lives in the dashboard.

project_id = "be-better-everyday"

[db]
major_version = 17

[db.seed]
# No seed data. The tests create their own users and delete them afterwards.
enabled = false

[auth]
site_url = "http://localhost:3000"
# The OAuth and email-confirmation return path — app/auth/callback/route.ts.
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# As on hosted: 12 characters, no composition rules — length does more than a
# required symbol (NIST SP 800-63B). Existing users still sign in; Supabase
# only checks a password when it is set. Safe for the tests, whose throwaway
# passwords are 36-character UUIDs.
minimum_password_length = 12
password_requirements = ""
# The defaults the hosted checklist keeps, written down. An access token lives
# an hour, so a revoked session can still read the database for up to that
# long; refresh tokens rotate, and one reused outside 10 s revokes its session.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Not mirrored, on purpose:
#   [auth.rate_limit]  the database tests sign in ~50 users from 127.0.0.1;
#                      hosted limits are in the checklist.
#   [auth.sessions]    time-box and inactivity timeout are Pro-plan on hosted
#                      (D-17: Free), so setting them here would make local lie.
#   max_frequency      a test may need two emails to one user in a minute.

[auth.email]
enable_signup = true
# Local only: no mail server to confirm against. The hosted project confirms.
enable_confirmations = false
# As on hosted (secure email change, the CLI default): a new address must be
# confirmed from the old one and the new one.
double_confirm_changes = true
# As on hosted (item 3): changing a password needs a session under 24 hours
# old, or a reauthenticate() nonce. A test that signs in and then changes the
# password is inside that window.
secure_password_change = true
# As on hosted (item 4): every email link and code — confirmation, reset, email
# change — lapses after 30 minutes, inside lib/supabase/cookies.ts's one-hour
# PKCE verifier. Ten-digit codes, the most Supabase allows: the emails carry
# links, so nobody types them, and a guessed code gets 10^4 times rarer.
otp_expiry = 1800
otp_length = 10

[auth.external.google]
# Needs a Google OAuth client. Enabled on the hosted project; locally the email
# path is enough to exercise sessions and RLS.
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
